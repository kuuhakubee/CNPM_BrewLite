version: '3.8'

services:
  # 1. Cơ sở dữ liệu PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: brewlite_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local}
      POSTGRES_DB: ${POSTGRES_DB:-brewlite_db}
    ports:
      # Cổng HOST là 5433 để tránh xung đột với PostgreSQL hệ thống đang chạy ở 5432.
      # Cổng NỘI BỘ trong Docker network vẫn là 5432 (service postgres:5432).
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-brewlite_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: always

  # 2. Backend NestJS API
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: brewlite_api
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-change-me-local}@postgres:5432/${POSTGRES_DB:-brewlite_db}?schema=public
      - PORT=4000
      - JWT_SECRET=${JWT_SECRET:-change-me-in-local}
      - PAYMENT_PROVIDER=${PAYMENT_PROVIDER:-mock}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:4000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: always

  # 3. Frontend Next.js
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: brewlite_web
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_started
    restart: always

volumes:
  postgres_data:
